# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

console_title_template: "{{.Folder}}"
pwd: osc99
blocks:
- type: prompt
  alignment: left
  segments:
  - style: plain
    template: " {{ if .WSL }}WSL at {{ end }}{{.Icon}} \ue0b1"
    foreground: "#26C6DA"
    background: "#546E7A"
    type: os
  - properties:
      root_icon: 
    style: powerline
    template: " \uf0e7 "
    foreground: "#26C6DA"
    powerline_symbol: 
    background: "#546E7A"
    type: root
  - properties:
      style: mixed
    style: plain
    template: " {{ .Path }} "
    foreground: "#26C6DA"
    background: "#546E7A"
    type: path
  - style: plain
    template: "<#26C6DA>\ue0b1 </>{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} \uf044 {{ .Working.String }}{{ end }}{{ if and (.Staging.Changed) (.Working.Changed) }} |{{ end }}{{ if .Staging.Changed }} \uf046 {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0}} \uf692 {{ .StashCount }}{{ end }}{{ if gt .WorktreeCount 0}} \uf1bb {{ .WorktreeCount }}{{ end }} "
    foreground: "#D4E157"
    background: "#546E7A"
    type: git
  - style: plain
    template: 
    foreground: "#546E7A"
    background: transparent
    type: text
- type: prompt
  alignment: right
  segments:
  - properties:
      always_enabled: true
      display_exit_code: true
    style: diamond
    leading_diamond: 
    template: "<#193549>\ue23a</> {{ if gt .Code 0 }}✘ {{ .Code }}{{ else }}✔ {{ end }}<#26C6DA>\ue0b3</> "
    foreground: "#D4E157"
    background: "#546E7A"
    type: status
    foreground_templates:
    - "{{ if gt .Code 0 }}#FF5252{{ end }}"
  - properties:
      style: austin
      threshold: 500
    style: diamond
    template: " <#fefefe>ﮫ</> {{ .FormattedMs }} <#26C6DA>\ue0b3</> "
    foreground: "#D4E157"
    background: "#546E7A"
    type: executiontime
  - style: powerline
    template: " {{ if .Error }}{{ .Error }}{{ else }}\ue235 {{ if .Venv }}{{ .Venv }}{{ else }}{{ .Full }}{{ end }}{{ end }} "
    foreground: "#D4E157"
    background: "#546E7A"
    type: python
  - properties:
      display_mode: files
    style: diamond
    template: "\ue77f {{ if .Unsupported }}\uf071{{ else }}{{ .Full }}{{ end }} <#26C6DA>\ue0b3</> "
    foreground: "#D4E157"
    background: "#546E7A"
    type: dotnet
- type: prompt
  alignment: left
  segments:
  - properties:
      always_enabled: true
    style: diamond
    template: "{{ if gt .Code 0 }}✘{{ .Code }}{{ else }}✔{{ end }} ❯ "
    foreground: "#D4E157"
    type: status
    foreground_templates:
    - "{{ if gt .Code 0 }}#FF5252{{ end }}"
  newline: true
tooltips:
- properties:
    source: cli
  style: powerline
  template: " ﴃ {{ .Name }}"
  foreground: "#D4E157"
  background: "#546E7A"
  type: az
  tips:
  - az
version: 3
